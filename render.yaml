services:
  - type: web
    name: aquawatch-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      # These flags tell Render to prompt the user for these secure credentials in the deployment UI!
      - key: SHUB_CLIENT_ID
        sync: false
      - key: SHUB_CLIENT_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: 3.13.0
